services:
  player-service:
    image: box-local-engine-player-service:${BOX_IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    environment:
      BOX_DEPLOYMENT_MODE: player-service
      NEXT_PUBLIC_APP_ENV: development
      NEXT_PUBLIC_APP_EDITION: createra
      NEXT_PUBLIC_APP_REGION: cn
      BOX_PLAY_ADMIN_TOKEN: ${BOX_PLAY_ADMIN_TOKEN:-}
      PERMISSION_TOKEN_SECRET: ${PERMISSION_TOKEN_SECRET:?请在 .env 中设置 PERMISSION_TOKEN_SECRET}
      BOX_SERVER_PUBLIC_URL: ${BOX_PLAYER_SERVICE_PUBLIC_URL:-http://127.0.0.1:3213}
      BOX_PLAYER_SERVICE_PUBLIC_URL: ${BOX_PLAYER_SERVICE_PUBLIC_URL:-http://127.0.0.1:3213}
      BOX_PLAY_PUBLIC_URL: ${BOX_PLAY_PUBLIC_URL:-http://127.0.0.1:3000}
      BOX_TRUST_PROXY: ${BOX_TRUST_PROXY:-false}
      BOX_DATABASE_URL: ${BOX_DATABASE_URL:-}
      BOX_IDENTITY_DATABASE_SCHEMA: ${BOX_IDENTITY_DATABASE_SCHEMA:-box_identity}
      BOX_PLAYER_REGISTRATION_ENABLED: ${BOX_PLAYER_REGISTRATION_ENABLED:-true}
      BOX_DATABASE_POOL_SIZE: ${BOX_DATABASE_POOL_SIZE:-10}
      BOX_DATABASE_SSL: ${BOX_DATABASE_SSL:-false}
      BOX_DATABASE_SSL_REJECT_UNAUTHORIZED: ${BOX_DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
    ports:
      - "${BOX_PLAYER_SERVICE_HOST_IP:-127.0.0.1}:${BOX_PLAYER_SERVICE_PORT:-3213}:3213"

  play:
    image: box-local-engine-play:${BOX_IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    depends_on:
      player-service:
        condition: service_healthy
    environment:
      BOX_DEPLOYMENT_MODE: play
      BOX_PLAY_LIBRARY_PATH: /app/play-worlds
      BOX_PLAY_ADMIN_TOKEN: ${BOX_PLAY_ADMIN_TOKEN:-}
      BOX_LOCAL_PLAYER_LIMIT: ${BOX_LOCAL_PLAYER_LIMIT:-8}
      PERMISSION_TOKEN_SECRET: ${PERMISSION_TOKEN_SECRET:?请在 .env 中设置 PERMISSION_TOKEN_SECRET}
      BOX_SERVER_PUBLIC_URL: ${BOX_SERVER_PUBLIC_URL:-}
      BOX_PLAYER_SERVICE_INTERNAL_URL: http://player-service:3213
      BOX_PLAYER_SERVICE_PUBLIC_URL: ${BOX_PLAYER_SERVICE_PUBLIC_URL:-http://127.0.0.1:3213}
      BOX_TRUST_PROXY: ${BOX_TRUST_PROXY:-false}
      BOX_SESSION_TTL_MS: ${BOX_SESSION_TTL_MS:-60000}
      BOX_PLAYER_REVOCATION_POLL_MS: ${BOX_PLAYER_REVOCATION_POLL_MS:-1000}
      BOX_SESSION_RATE_LIMIT_PER_MINUTE: ${BOX_SESSION_RATE_LIMIT_PER_MINUTE:-60}
      BOX_DATA_STORAGE_PATH: /app/play-storage
      BOX_DATABASE_URL: ${BOX_DATABASE_URL:-}
      BOX_DATABASE_SCHEMA: ${BOX_DATABASE_SCHEMA:-box_engine}
      BOX_DATABASE_POOL_SIZE: ${BOX_DATABASE_POOL_SIZE:-10}
      BOX_DATABASE_SSL: ${BOX_DATABASE_SSL:-false}
      BOX_DATABASE_SSL_REJECT_UNAUTHORIZED: ${BOX_DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      BOX_DATA_STORAGE_NAMESPACE_PREFIX: ${BOX_DATA_STORAGE_NAMESPACE_PREFIX:-}
      BOX_GROUP_STORAGE_NAMESPACE: ${BOX_GROUP_STORAGE_NAMESPACE:-global}
    ports:
      - "${BOX_PLAY_HOST_IP:-127.0.0.1}:${BOX_PLAY_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ./play-worlds
        target: /app/play-worlds
        read_only: ${BOX_PLAY_LIBRARY_READ_ONLY:-true}
        bind:
          create_host_path: true
      - box-play-storage:/app/play-storage

volumes:
  box-play-storage:
