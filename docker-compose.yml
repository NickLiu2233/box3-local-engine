name: box-local-engine

services:
  postgres:
    profiles: [infra]
    image: ${BOX_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BOX_POSTGRES_DB:-box}
      POSTGRES_USER: ${BOX_POSTGRES_USER:-box}
      POSTGRES_PASSWORD: ${BOX_POSTGRES_PASSWORD:-local-box-change-me}
    ports:
      - "127.0.0.1:${BOX_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - box-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    profiles: [infra]
    image: ${BOX_REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    environment:
      BOX_REDIS_PASSWORD: ${BOX_REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        if [ -n "$$BOX_REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$BOX_REDIS_PASSWORD";
        else
          exec redis-server --appendonly yes;
        fi
    ports:
      - "127.0.0.1:${BOX_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - box-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$BOX_REDIS_PASSWORD\" ]; then redis-cli -a \"$$BOX_REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 5s
      retries: 20

  player-service:
    profiles: [player-service]
    platform: ${BOX_PLAY_PLATFORM:-linux/amd64}
    image: box-local-engine-player-service:${BOX_IMAGE_TAG:-0.1.0}
    build:
      context: .
      dockerfile: apps/local-engine/Dockerfile
      target: player-service
      args:
        NODE_IMAGE: ${BOX_DOCKER_NODE_IMAGE:-docker.m.daocloud.io/library/node:22.17.0-bookworm-slim}
        BOX_BUILD_VERSION: ${BOX_BUILD_VERSION:-0.1.0}
        BOX_BUILD_COMMIT: ${BOX_BUILD_COMMIT:-unknown}
        BOX_BUILD_DATE: ${BOX_BUILD_DATE:-unknown}
        BOX_BUILD_SOURCE: ${BOX_BUILD_SOURCE:-local}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${BOX_PLAYER_SERVICE_MEMORY_LIMIT:-1g}
    cpus: ${BOX_PLAYER_SERVICE_CPU_LIMIT:-1.0}
    pids_limit: ${BOX_PLAYER_SERVICE_PIDS_LIMIT:-256}
    environment:
      BOX_DEPLOYMENT_MODE: player-service
      NEXT_PUBLIC_APP_ENV: development
      NEXT_PUBLIC_APP_EDITION: createra
      NEXT_PUBLIC_APP_REGION: cn
      BOX_PLAY_ADMIN_TOKEN: ${BOX_PLAY_ADMIN_TOKEN:-}
      PERMISSION_TOKEN_SECRET: ${PERMISSION_TOKEN_SECRET:-}
      BOX_SERVER_PUBLIC_URL: ${BOX_PLAYER_SERVICE_PUBLIC_URL:-http://127.0.0.1:3213}
      BOX_PLAYER_SERVICE_PUBLIC_URL: ${BOX_PLAYER_SERVICE_PUBLIC_URL:-http://127.0.0.1:3213}
      BOX_CREATOR_PUBLIC_URL: ${BOX_CREATOR_PUBLIC_URL:-http://127.0.0.1:3002}
      BOX_PLAY_PUBLIC_URL: ${BOX_PLAY_PUBLIC_URL:-http://127.0.0.1:3000}
      BOX_PLAYER_LOGIN_URL: ${BOX_PLAYER_LOGIN_URL:-}
      BOX_PLAYER_AUTH_API_KEY: ${BOX_PLAYER_AUTH_API_KEY:-}
      BOX_PLAYER_AUTH_ALLOWED_ORIGINS: ${BOX_PLAYER_AUTH_ALLOWED_ORIGINS:-}
      BOX_TRUST_PROXY: ${BOX_TRUST_PROXY:-false}
      BOX_RUNTIME_IDENTITY_TTL_MS: ${BOX_RUNTIME_IDENTITY_TTL_MS:-300000}
      BOX_DATABASE_URL: ${BOX_DATABASE_URL:-}
      BOX_IDENTITY_DATABASE_SCHEMA: ${BOX_IDENTITY_DATABASE_SCHEMA:-box_identity}
      BOX_PLAYER_REGISTRATION_ENABLED: ${BOX_PLAYER_REGISTRATION_ENABLED:-true}
      BOX_LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${BOX_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-10}
      BOX_LOGIN_RATE_LIMIT_WINDOW_MS: ${BOX_LOGIN_RATE_LIMIT_WINDOW_MS:-300000}
      BOX_REGISTRATION_RATE_LIMIT_MAX_ATTEMPTS: ${BOX_REGISTRATION_RATE_LIMIT_MAX_ATTEMPTS:-5}
      BOX_REGISTRATION_RATE_LIMIT_WINDOW_MS: ${BOX_REGISTRATION_RATE_LIMIT_WINDOW_MS:-3600000}
      BOX_PLAYER_COOKIE_DOMAIN: ${BOX_PLAYER_COOKIE_DOMAIN:-}
      BOX_DATABASE_POOL_SIZE: ${BOX_DATABASE_POOL_SIZE:-10}
      BOX_DATABASE_SSL: ${BOX_DATABASE_SSL:-false}
      BOX_DATABASE_SSL_REJECT_UNAUTHORIZED: ${BOX_DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
    ports:
      - "127.0.0.1:${BOX_PLAYER_SERVICE_PORT:-3213}:3213"

  player-auth-portal:
    profiles: [auth-portal]
    platform: ${BOX_PLAY_PLATFORM:-linux/amd64}
    image: box-local-engine-player-auth-portal:${BOX_IMAGE_TAG:-0.1.0}
    build:
      context: ./examples/player-auth-portal
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${BOX_DOCKER_NODE_IMAGE:-docker.m.daocloud.io/library/node:22.17.0-bookworm-slim}
        BOX_BUILD_VERSION: ${BOX_BUILD_VERSION:-0.1.0}
        BOX_BUILD_COMMIT: ${BOX_BUILD_COMMIT:-unknown}
        BOX_BUILD_DATE: ${BOX_BUILD_DATE:-unknown}
        BOX_BUILD_SOURCE: ${BOX_BUILD_SOURCE:-local}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${BOX_AUTH_PORTAL_MEMORY_LIMIT:-128m}
    cpus: ${BOX_AUTH_PORTAL_CPU_LIMIT:-0.5}
    pids_limit: ${BOX_AUTH_PORTAL_PIDS_LIMIT:-64}
    environment:
      AUTH_DEMO_HOST: 0.0.0.0
      AUTH_DEMO_PORT: 3214
      AUTH_DEMO_PLAYER_SERVICE_URL: http://player-service:3213
      AUTH_DEMO_PUBLIC_URL: ${BOX_AUTH_PORTAL_PUBLIC_URL:-http://127.0.0.1:3214}
      AUTH_DEMO_CREATOR_URL: ${BOX_CREATOR_PUBLIC_URL:-http://127.0.0.1:3002}
      AUTH_DEMO_PLAY_URL: ${BOX_PLAY_PUBLIC_URL:-http://127.0.0.1:3000}
      AUTH_DEMO_API_KEY: ${BOX_PLAYER_AUTH_API_KEY:-}
      AUTH_DEMO_REQUEST_TIMEOUT_MS: ${BOX_AUTH_PORTAL_REQUEST_TIMEOUT_MS:-10000}
      AUTH_DEMO_TRUST_PROXY: ${BOX_TRUST_PROXY:-false}
    ports:
      - "${BOX_AUTH_PORTAL_HOST_IP:-127.0.0.1}:${BOX_AUTH_PORTAL_PORT:-3214}:3214"

  creator:
    profiles: [creator]
    image: box-local-engine-creator:${BOX_IMAGE_TAG:-0.1.0}
    build:
      context: .
      dockerfile: apps/local-engine/Dockerfile
      target: creator
      args:
        NODE_IMAGE: ${BOX_DOCKER_NODE_IMAGE:-docker.m.daocloud.io/library/node:22.17.0-bookworm-slim}
        BOX_BUILD_VERSION: ${BOX_BUILD_VERSION:-0.1.0}
        BOX_BUILD_COMMIT: ${BOX_BUILD_COMMIT:-unknown}
        BOX_BUILD_DATE: ${BOX_BUILD_DATE:-unknown}
        BOX_BUILD_SOURCE: ${BOX_BUILD_SOURCE:-local}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${BOX_CREATOR_MEMORY_LIMIT:-6g}
    cpus: ${BOX_CREATOR_CPU_LIMIT:-4.0}
    pids_limit: ${BOX_CREATOR_PIDS_LIMIT:-1024}
    environment:
      BOX_DEPLOYMENT_MODE: creator
      BOX_BUILD_VERSION: ${BOX_BUILD_VERSION:-0.1.0}
      BOX_BUILD_COMMIT: ${BOX_BUILD_COMMIT:-unknown}
      BOX_BUILD_DATE: ${BOX_BUILD_DATE:-unknown}
      BOX_BUILD_SOURCE: ${BOX_BUILD_SOURCE:-local}
      VOXA_URL: http://127.0.0.1:${BOX_VOXA_PORT:-3001}
      VOXA_INTERNAL_URL: http://voxa:3001
      BOX_IMAGE_TAG: ${BOX_IMAGE_TAG:-0.1.0}
      BOX_PLAY_IMAGE: box-local-engine-play:${BOX_IMAGE_TAG:-0.1.0}
      BOX_PLAY_IMAGE_ARCHIVE: /app/apps/local-engine/dist/images/play-image.tar
      BOX_PLAY_PLATFORM: ${BOX_PLAY_PLATFORM:-linux/amd64}
      # Docker publishes these ports only on host 127.0.0.1 below. Inside the
      # container they must listen on all interfaces so Docker port forwarding
      # can reach them; container loopback is not reachable through -p.
      BOX_PLAY_RUNTIME_HOST: 0.0.0.0
      BOX_EDIT_RUNTIME_HOST: 0.0.0.0
      BOX_LOCAL_PLAYER_LIMIT: ${BOX_LOCAL_PLAYER_LIMIT:-8}
      PERMISSION_TOKEN_SECRET: ${PERMISSION_TOKEN_SECRET:-}
      BOX_SERVER_PUBLIC_URL: ${BOX_SERVER_PUBLIC_URL:-}
      BOX_PLAYER_SERVICE_INTERNAL_URL: http://player-service:3213
      BOX_PLAYER_SERVICE_PUBLIC_URL: ${BOX_PLAYER_SERVICE_PUBLIC_URL:-http://127.0.0.1:3213}
      BOX_CREATOR_PUBLIC_URL: ${BOX_CREATOR_PUBLIC_URL:-http://127.0.0.1:3002}
      BOX_PLAYER_LOGIN_URL: ${BOX_PLAYER_LOGIN_URL:-}
      BOX_TRUST_PROXY: ${BOX_TRUST_PROXY:-false}
      BOX_SESSION_TTL_MS: ${BOX_SESSION_TTL_MS:-60000}
      BOX_RUNTIME_IDENTITY_TTL_MS: ${BOX_RUNTIME_IDENTITY_TTL_MS:-300000}
      BOX_SCRIPT_HEAP_MB: ${BOX_SCRIPT_HEAP_MB:-512}
      SCRIPT_MEMORY_LIMIT: ${BOX_SCRIPT_MEMORY_MB:-512}
      BOX_PLAYER_REVOCATION_POLL_MS: ${BOX_PLAYER_REVOCATION_POLL_MS:-1000}
      BOX_SESSION_RATE_LIMIT_PER_MINUTE: ${BOX_SESSION_RATE_LIMIT_PER_MINUTE:-60}
      BOX_CREATE_SESSION_TIMEOUT_MS: ${BOX_CREATE_SESSION_TIMEOUT_MS:-120000}
      BOX_CREATOR_EDIT_MAX_RUNTIMES: ${BOX_CREATOR_EDIT_MAX_RUNTIMES:-6}
      BOX_CREATOR_PLAY_MAX_RUNTIMES: ${BOX_CREATOR_PLAY_MAX_RUNTIMES:-4}
      BOX_CREATOR_EDIT_PREWARM_RUNTIMES: ${BOX_CREATOR_EDIT_PREWARM_RUNTIMES:-6}
      BOX_CREATOR_PLAY_PREWARM_RUNTIMES: ${BOX_CREATOR_PLAY_PREWARM_RUNTIMES:-4}
      BOX_RUNTIME_IDLE_TIMEOUT_MS: ${BOX_RUNTIME_IDLE_TIMEOUT_MS:-900000}
      BOX_RUNTIME_START_TIMEOUT_MS: ${BOX_RUNTIME_START_TIMEOUT_MS:-1800000}
      BOX_GROUP_STATE_LOCK_TIMEOUT_MS: ${BOX_GROUP_STATE_LOCK_TIMEOUT_MS:-30000}
      BOX_GROUP_STATE_LOCK_STALE_MS: ${BOX_GROUP_STATE_LOCK_STALE_MS:-300000}
      BOX_TELEPORT_MAX_ROOMS: ${BOX_TELEPORT_MAX_ROOMS:-64}
      BOX_TELEPORT_ROOM_IDLE_TIMEOUT_MS: ${BOX_TELEPORT_ROOM_IDLE_TIMEOUT_MS:-900000}
      BOX_RUNTIME_CACHE_PATH: /app/apps/local-engine/projects/.runtime-cache
      BOX_AUTO_BACKUP_ENABLED: ${BOX_AUTO_BACKUP_ENABLED:-false}
      BOX_AUTO_BACKUP_INTERVAL_MINUTES: ${BOX_AUTO_BACKUP_INTERVAL_MINUTES:-60}
      BOX_AUTO_BACKUP_RETENTION_COUNT: ${BOX_AUTO_BACKUP_RETENTION_COUNT:-24}
      BOX_AUTO_BACKUP_RETENTION_DAYS: ${BOX_AUTO_BACKUP_RETENTION_DAYS:-30}
      BOX_PROJECT_BACKUP_PATH: ${BOX_PROJECT_BACKUP_PATH:-/app/apps/local-engine/backups}
      BOX_CREATOR_ALLOWED_HOSTS: ${BOX_CREATOR_ALLOWED_HOSTS:-}
      BOX_DATA_STORAGE_PATH: /app/apps/local-engine/projects/.storage
      BOX_DATABASE_URL: ${BOX_DATABASE_URL:-}
      BOX_DATABASE_SCHEMA: ${BOX_DATABASE_SCHEMA:-box_engine}
      BOX_DATABASE_POOL_SIZE: ${BOX_DATABASE_POOL_SIZE:-10}
      BOX_DATABASE_SSL: ${BOX_DATABASE_SSL:-false}
      BOX_DATABASE_SSL_REJECT_UNAUTHORIZED: ${BOX_DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      BOX_DATA_STORAGE_LOCK_TIMEOUT_MS: ${BOX_DATA_STORAGE_LOCK_TIMEOUT_MS:-10000}
      BOX_DATA_STORAGE_NAMESPACE_PREFIX: ${BOX_DATA_STORAGE_NAMESPACE_PREFIX:-}
      BOX_LOCAL_VOXA_DATA_PATH: /app/apps/voxa/data
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      STORAGE_CACHE_REDIS_DB: ${STORAGE_CACHE_REDIS_DB:-1}
      STORAGE_CACHE_REDIS_TTL: ${STORAGE_CACHE_REDIS_TTL:-240}
    ports:
      - "127.0.0.1:${BOX_CREATOR_PORT:-3002}:3000"
      - "127.0.0.1:9966:9966"
      - "127.0.0.1:9967:9967"
    volumes:
      - ./apps/local-engine/projects:/app/apps/local-engine/projects
      - ./apps/local-engine/dist:/app/apps/local-engine/dist
      - ./apps/local-engine/backups:/app/apps/local-engine/backups
      - ./apps/voxa/data:/app/apps/voxa/data:ro

  play-storage-init:
    profiles: [play]
    image: box-local-engine-play:${BOX_IMAGE_TAG:-0.1.0}
    user: "0:0"
    command:
      - sh
      - -c
      - mkdir -p /app/play-storage/runtime-cache && chown -R 1000:1000 /app/play-storage
    restart: "no"
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    volumes:
      - box-play-storage:/app/play-storage

  play:
    profiles: [play]
    platform: ${BOX_PLAY_PLATFORM:-linux/amd64}
    image: box-local-engine-play:${BOX_IMAGE_TAG:-0.1.0}
    build:
      context: .
      dockerfile: apps/local-engine/Dockerfile
      target: play
      args:
        NODE_IMAGE: ${BOX_DOCKER_NODE_IMAGE:-docker.m.daocloud.io/library/node:22.17.0-bookworm-slim}
        BOX_BUILD_VERSION: ${BOX_BUILD_VERSION:-0.1.0}
        BOX_BUILD_COMMIT: ${BOX_BUILD_COMMIT:-unknown}
        BOX_BUILD_DATE: ${BOX_BUILD_DATE:-unknown}
        BOX_BUILD_SOURCE: ${BOX_BUILD_SOURCE:-local}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${BOX_PLAY_MEMORY_LIMIT:-4g}
    cpus: ${BOX_PLAY_CPU_LIMIT:-4.0}
    pids_limit: ${BOX_PLAY_PIDS_LIMIT:-1024}
    depends_on:
      play-storage-init:
        condition: service_completed_successfully
    environment:
      BOX_DEPLOYMENT_MODE: play
      BOX_PLAY_LIBRARY_PATH: /app/play-worlds
      BOX_PLAY_ADMIN_TOKEN: ${BOX_PLAY_ADMIN_TOKEN:-}
      BOX_LOCAL_PLAYER_LIMIT: ${BOX_LOCAL_PLAYER_LIMIT:-8}
      PERMISSION_TOKEN_SECRET: ${PERMISSION_TOKEN_SECRET:-}
      BOX_SERVER_PUBLIC_URL: ${BOX_SERVER_PUBLIC_URL:-}
      BOX_PLAYER_SERVICE_INTERNAL_URL: http://player-service:3213
      BOX_PLAYER_SERVICE_PUBLIC_URL: ${BOX_PLAYER_SERVICE_PUBLIC_URL:-http://127.0.0.1:3213}
      BOX_PLAY_PUBLIC_URL: ${BOX_PLAY_PUBLIC_URL:-http://127.0.0.1:3000}
      BOX_PLAYER_LOGIN_URL: ${BOX_PLAYER_LOGIN_URL:-}
      BOX_TRUST_PROXY: ${BOX_TRUST_PROXY:-false}
      BOX_SESSION_TTL_MS: ${BOX_SESSION_TTL_MS:-60000}
      BOX_RUNTIME_IDENTITY_TTL_MS: ${BOX_RUNTIME_IDENTITY_TTL_MS:-300000}
      BOX_SCRIPT_HEAP_MB: ${BOX_SCRIPT_HEAP_MB:-512}
      SCRIPT_MEMORY_LIMIT: ${BOX_SCRIPT_MEMORY_MB:-512}
      BOX_PLAYER_REVOCATION_POLL_MS: ${BOX_PLAYER_REVOCATION_POLL_MS:-1000}
      BOX_SESSION_RATE_LIMIT_PER_MINUTE: ${BOX_SESSION_RATE_LIMIT_PER_MINUTE:-60}
      BOX_CREATE_SESSION_TIMEOUT_MS: ${BOX_CREATE_SESSION_TIMEOUT_MS:-120000}
      BOX_PLAY_MAX_RUNTIMES: ${BOX_PLAY_MAX_RUNTIMES:-8}
      BOX_PLAY_PREWARM_RUNTIMES: ${BOX_PLAY_PREWARM_RUNTIMES:-8}
      BOX_RUNTIME_IDLE_TIMEOUT_MS: ${BOX_RUNTIME_IDLE_TIMEOUT_MS:-900000}
      BOX_RUNTIME_START_TIMEOUT_MS: ${BOX_RUNTIME_START_TIMEOUT_MS:-1800000}
      BOX_TELEPORT_MAX_ROOMS: ${BOX_TELEPORT_MAX_ROOMS:-64}
      BOX_TELEPORT_ROOM_IDLE_TIMEOUT_MS: ${BOX_TELEPORT_ROOM_IDLE_TIMEOUT_MS:-900000}
      BOX_RUNTIME_CACHE_PATH: /app/play-storage/runtime-cache
      BOX_DATA_STORAGE_PATH: /app/play-storage
      BOX_DATABASE_URL: ${BOX_DATABASE_URL:-}
      BOX_DATABASE_SCHEMA: ${BOX_DATABASE_SCHEMA:-box_engine}
      BOX_DATABASE_POOL_SIZE: ${BOX_DATABASE_POOL_SIZE:-10}
      BOX_DATABASE_SSL: ${BOX_DATABASE_SSL:-false}
      BOX_DATABASE_SSL_REJECT_UNAUTHORIZED: ${BOX_DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      BOX_DATA_STORAGE_LOCK_TIMEOUT_MS: ${BOX_DATA_STORAGE_LOCK_TIMEOUT_MS:-10000}
      BOX_DATA_STORAGE_NAMESPACE_PREFIX: ${BOX_DATA_STORAGE_NAMESPACE_PREFIX:-}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      STORAGE_CACHE_REDIS_DB: ${STORAGE_CACHE_REDIS_DB:-1}
      STORAGE_CACHE_REDIS_TTL: ${STORAGE_CACHE_REDIS_TTL:-240}
    ports:
      - "${BOX_PLAY_HOST_IP:-127.0.0.1}:${BOX_PLAY_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: "${BOX_PLAY_LIBRARY_DIR:-./apps/local-engine/play-worlds}"
        target: /app/play-worlds
        read_only: ${BOX_PLAY_LIBRARY_READ_ONLY:-true}
        bind:
          create_host_path: true
      - box-play-storage:/app/play-storage

  voxa:
    profiles: [voxa]
    image: box-local-engine-voxa:${BOX_IMAGE_TAG:-0.1.0}
    build:
      context: .
      dockerfile: apps/local-engine/Dockerfile
      target: voxa
      args:
        NODE_IMAGE: ${BOX_DOCKER_NODE_IMAGE:-docker.m.daocloud.io/library/node:22.17.0-bookworm-slim}
        BOX_BUILD_VERSION: ${BOX_BUILD_VERSION:-0.1.0}
        BOX_BUILD_COMMIT: ${BOX_BUILD_COMMIT:-unknown}
        BOX_BUILD_DATE: ${BOX_BUILD_DATE:-unknown}
        BOX_BUILD_SOURCE: ${BOX_BUILD_SOURCE:-local}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      VOXA_DATA_PATH: /app/apps/voxa/data
      VOXA_MAX_BLOB_BYTES: ${VOXA_MAX_BLOB_BYTES:-268435456}
      BOX_CREATOR_PUBLIC_URL: ${BOX_CREATOR_PUBLIC_URL:-http://127.0.0.1:3002}
    ports:
      - "127.0.0.1:${BOX_VOXA_PORT:-3001}:3001"
    volumes:
      - ./apps/voxa/data:/app/apps/voxa/data

  migrator:
    profiles: [migrator]
    image: box-local-engine-migrator:${BOX_IMAGE_TAG:-0.1.0}
    build:
      context: .
      dockerfile: apps/migrator/Dockerfile
      args:
        NODE_IMAGE: ${BOX_DOCKER_NODE_IMAGE:-docker.m.daocloud.io/library/node:22.17.0-bookworm-slim}
    restart: unless-stopped
    environment:
      # Production creator backend. Override with the staging host only for tests.
      BOX_MIGRATOR_ENGINE_API_URL: ${BOX_MIGRATOR_ENGINE_API_URL:-https://code-api-pc.dao3.fun}
      # Engine backend credential used by boxes as request-header-fixed-key.
      BOX_MIGRATOR_ENGINE_API_KEY: ${BOX_MIGRATOR_ENGINE_API_KEY:-}
      # Optional gateway Authorization value when the deployment requires both headers.
      BOX_MIGRATOR_ENGINE_AUTHORIZATION: ${BOX_MIGRATOR_ENGINE_AUTHORIZATION:-}
      BOX_MIGRATOR_ENGINE_API_TIMEOUT_MS: ${BOX_MIGRATOR_ENGINE_API_TIMEOUT_MS:-15000}
      # Optional IPFS HTTP API base. This matches boxes' GoIPFSStore request
      # shape and appends /block/get?arg=<hash> automatically.
      BOX_MIGRATOR_CONTENT_API_URL: ${BOX_MIGRATOR_CONTENT_API_URL:-}
      # Required. Either a URL template with {hash}, or a base URL to which
      # /block/<hash> is appended, for example https://cdn.example.com.
      BOX_MIGRATOR_CONTENT_URL: ${BOX_MIGRATOR_CONTENT_URL:-}
      # Optional server-side credential for a private cloud content endpoint.
      BOX_MIGRATOR_AUTHORIZATION: ${BOX_MIGRATOR_AUTHORIZATION:-}
      # UI images, models, skins and project scripts may use the cloud OSS
      # namespace instead of IPFS /block objects.
      BOX_MIGRATOR_OSS_URL: ${BOX_MIGRATOR_OSS_URL:-https://assets.box3.fun}
      BOX_MIGRATOR_MAX_BLOBS: ${BOX_MIGRATOR_MAX_BLOBS:-20000}
      BOX_MIGRATOR_MAX_TOTAL_BYTES: ${BOX_MIGRATOR_MAX_TOTAL_BYTES:-1073741824}
      BOX_MIGRATOR_MAX_BLOB_BYTES: ${BOX_MIGRATOR_MAX_BLOB_BYTES:-67108864}
      BOX_MIGRATOR_CONCURRENCY: ${BOX_MIGRATOR_CONCURRENCY:-32}
      BOX_MIGRATOR_SCAN_CONCURRENCY: ${BOX_MIGRATOR_SCAN_CONCURRENCY:-512}
      BOX_MIGRATOR_REQUEST_TIMEOUT_MS: ${BOX_MIGRATOR_REQUEST_TIMEOUT_MS:-8000}
      BOX_MIGRATOR_RESULT_RETENTION_MS: ${BOX_MIGRATOR_RESULT_RETENTION_MS:-3600000}
      BOX_MIGRATOR_MODEL_MIGRATION_POLLS: ${BOX_MIGRATOR_MODEL_MIGRATION_POLLS:-60}
      BOX_MIGRATOR_CACHE_DIR: /app/cache
    ports:
      - "127.0.0.1:${BOX_MIGRATOR_PORT:-3212}:3212"
    volumes:
      - ./apps/migrator/cache:/app/cache

volumes:
  box-postgres-data:
  box-redis-data:
  box-play-storage:
