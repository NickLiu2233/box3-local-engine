name: box-local-engine

services:
  server:
    image: box-local-engine-server:0.1.0
    build:
      context: .
      dockerfile: services/game-server/Dockerfile
      args:
        NODE_IMAGE: ${BOX_DOCKER_NODE_IMAGE:-node:22.17.0-bookworm-slim}
    restart: unless-stopped
    environment:
      BOX_SERVER_HOST: 0.0.0.0
      BOX_SERVER_PORT: 9966
      BOX_SERVER_PUBLIC_URL: ${BOX_SERVER_PUBLIC_URL:-}
      BOX_SERVER_NAME: ${BOX_SERVER_NAME:-BOX Dedicated Server}
      BOX_SERVER_CONTENT_ID: ${BOX_SERVER_CONTENT_ID:-0}
      BOX_LOCAL_PLAYER_LIMIT: ${BOX_LOCAL_PLAYER_LIMIT:-8}
    ports:
      - "${BOX_SERVER_PUBLISHED_PORT:-9966}:9966"
    volumes:
      - box-server-data:/app/apps/local-engine/data

  client:
    image: box-local-engine-client:0.1.0
    build:
      context: .
      dockerfile: apps/game/Dockerfile
      args:
        NODE_IMAGE: ${BOX_DOCKER_NODE_IMAGE:-node:22.17.0-bookworm-slim}
    restart: unless-stopped
    environment:
      BOX_CLIENT_HOST: 0.0.0.0
      BOX_CLIENT_PORT: 3000
      BOX_REMOTE_SERVER_URL: ${BOX_REMOTE_SERVER_URL:-}
    ports:
      - "${BOX_CLIENT_PUBLISHED_PORT:-3000}:3000"

volumes:
  box-server-data:
