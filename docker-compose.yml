name: box-local-engine

services:
  creator:
    profiles: [creator]
    image: box-local-engine-creator:${BOX_IMAGE_TAG:-0.1.0}
    build:
      context: .
      dockerfile: apps/local-engine/Dockerfile
      target: creator
      args:
        NODE_IMAGE: ${BOX_DOCKER_NODE_IMAGE:-node:22.17.0-bookworm-slim}
    restart: unless-stopped
    environment:
      BOX_DEPLOYMENT_MODE: creator
      VOXA_URL: http://127.0.0.1:${BOX_VOXA_PORT:-3001}
      BOX_IMAGE_TAG: ${BOX_IMAGE_TAG:-0.1.0}
      BOX_PLAY_IMAGE: box-local-engine-play:${BOX_IMAGE_TAG:-0.1.0}
      BOX_PLAY_IMAGE_ARCHIVE: /app/apps/local-engine/dist/images/play-image.tar
      BOX_PLAY_PLATFORM: ${BOX_PLAY_PLATFORM:-linux/amd64}
      # Docker publishes these ports only on host 127.0.0.1 below. Inside the
      # container they must listen on all interfaces so Docker port forwarding
      # can reach them; container loopback is not reachable through -p.
      BOX_PLAY_RUNTIME_HOST: 0.0.0.0
      BOX_EDIT_RUNTIME_HOST: 0.0.0.0
      BOX_LOCAL_PLAYER_LIMIT: ${BOX_LOCAL_PLAYER_LIMIT:-8}
      PERMISSION_TOKEN_SECRET: ${PERMISSION_TOKEN_SECRET:-}
      BOX_SERVER_PUBLIC_URL: ${BOX_SERVER_PUBLIC_URL:-}
      BOX_TRUST_PROXY: ${BOX_TRUST_PROXY:-false}
      BOX_SESSION_TTL_MS: ${BOX_SESSION_TTL_MS:-60000}
      BOX_SESSION_RATE_LIMIT_PER_MINUTE: ${BOX_SESSION_RATE_LIMIT_PER_MINUTE:-60}
      BOX_CREATOR_ALLOWED_HOSTS: ${BOX_CREATOR_ALLOWED_HOSTS:-}
      BOX_DATA_STORAGE_DRIVER: ${BOX_DATA_STORAGE_DRIVER:-legacy}
      BOX_DATABASE_URL: ${BOX_DATABASE_URL:-}
      BOX_DATABASE_SCHEMA: ${BOX_DATABASE_SCHEMA:-box_engine}
      BOX_DATABASE_POOL_SIZE: ${BOX_DATABASE_POOL_SIZE:-10}
      BOX_DATABASE_SSL: ${BOX_DATABASE_SSL:-false}
      BOX_DATABASE_SSL_REJECT_UNAUTHORIZED: ${BOX_DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      BOX_DATA_STORAGE_LOCK_TIMEOUT_MS: ${BOX_DATA_STORAGE_LOCK_TIMEOUT_MS:-10000}
      BOX_DATA_STORAGE_NAMESPACE: ${BOX_DATA_STORAGE_NAMESPACE:-}
      BOX_DATA_STORAGE_NAMESPACE_PREFIX: ${BOX_DATA_STORAGE_NAMESPACE_PREFIX:-}
      BOX_GROUP_STORAGE_NAMESPACE: ${BOX_GROUP_STORAGE_NAMESPACE:-}
    ports:
      - "127.0.0.1:${BOX_CREATOR_PORT:-3002}:3000"
      - "127.0.0.1:9966:9966"
      - "127.0.0.1:9967:9967"
    volumes:
      - ./apps/local-engine/projects:/app/apps/local-engine/projects
      - ./apps/local-engine/dist:/app/apps/local-engine/dist

  play:
    profiles: [play]
    platform: ${BOX_PLAY_PLATFORM:-linux/amd64}
    image: box-local-engine-play:${BOX_IMAGE_TAG:-0.1.0}
    build:
      context: .
      dockerfile: apps/local-engine/Dockerfile
      target: play
      args:
        NODE_IMAGE: ${BOX_DOCKER_NODE_IMAGE:-node:22.17.0-bookworm-slim}
    restart: unless-stopped
    environment:
      BOX_DEPLOYMENT_MODE: play
      BOX_PLAY_LIBRARY_PATH: /app/play-worlds
      BOX_PLAY_ADMIN_TOKEN: ${BOX_PLAY_ADMIN_TOKEN:-}
      BOX_LOCAL_PLAYER_LIMIT: ${BOX_LOCAL_PLAYER_LIMIT:-8}
      PERMISSION_TOKEN_SECRET: ${PERMISSION_TOKEN_SECRET:-}
      BOX_SERVER_PUBLIC_URL: ${BOX_SERVER_PUBLIC_URL:-}
      BOX_TRUST_PROXY: ${BOX_TRUST_PROXY:-false}
      BOX_SESSION_TTL_MS: ${BOX_SESSION_TTL_MS:-60000}
      BOX_SESSION_RATE_LIMIT_PER_MINUTE: ${BOX_SESSION_RATE_LIMIT_PER_MINUTE:-60}
      BOX_DATA_STORAGE_DRIVER: ${BOX_DATA_STORAGE_DRIVER:-legacy}
      BOX_DATABASE_URL: ${BOX_DATABASE_URL:-}
      BOX_DATABASE_SCHEMA: ${BOX_DATABASE_SCHEMA:-box_engine}
      BOX_DATABASE_POOL_SIZE: ${BOX_DATABASE_POOL_SIZE:-10}
      BOX_DATABASE_SSL: ${BOX_DATABASE_SSL:-false}
      BOX_DATABASE_SSL_REJECT_UNAUTHORIZED: ${BOX_DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      BOX_DATA_STORAGE_LOCK_TIMEOUT_MS: ${BOX_DATA_STORAGE_LOCK_TIMEOUT_MS:-10000}
      BOX_DATA_STORAGE_NAMESPACE: ${BOX_DATA_STORAGE_NAMESPACE:-}
      BOX_DATA_STORAGE_NAMESPACE_PREFIX: ${BOX_DATA_STORAGE_NAMESPACE_PREFIX:-}
      BOX_GROUP_STORAGE_NAMESPACE: ${BOX_GROUP_STORAGE_NAMESPACE:-}
    ports:
      - "${BOX_PLAY_HOST_IP:-127.0.0.1}:${BOX_PLAY_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: "${BOX_PLAY_LIBRARY_DIR:-./apps/local-engine/play-worlds}"
        target: /app/play-worlds
        read_only: ${BOX_PLAY_LIBRARY_READ_ONLY:-true}
        bind:
          create_host_path: true

  voxa:
    profiles: [voxa]
    image: box-local-engine-voxa:${BOX_IMAGE_TAG:-0.1.0}
    build:
      context: .
      dockerfile: apps/local-engine/Dockerfile
      target: voxa
      args:
        NODE_IMAGE: ${BOX_DOCKER_NODE_IMAGE:-node:22.17.0-bookworm-slim}
    restart: unless-stopped
    environment:
      VOXA_DATA_PATH: /app/apps/voxa/data
      VOXA_MAX_BLOB_BYTES: ${VOXA_MAX_BLOB_BYTES:-268435456}
    ports:
      - "127.0.0.1:${BOX_VOXA_PORT:-3001}:3001"
    volumes:
      - ./apps/voxa/data:/app/apps/voxa/data
