[package]
name = "box-local-engine-manager"
version = "0.1.0"
description = "Native deployment manager for BOX Local Engine"
authors = ["BOX Local Engine contributors"]
edition = "2021"
license = "UNLICENSED"

[lib]
name = "box_local_engine_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
urlencoding = "2"

