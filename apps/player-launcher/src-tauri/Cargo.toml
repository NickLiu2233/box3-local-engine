[package]
name = "box-player-launcher"
version = "0.2.0"
description = "Standalone player launcher for BOX3 maps"
authors = ["BOX Local Engine contributors"]
edition = "2021"
license = "UNLICENSED"

[lib]
name = "box_player_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
fs2 = "0.4"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
reqwest = { version = "0.13", features = ["json"] }
url = "2"

[profile.release]
debug = false
strip = "symbols"
