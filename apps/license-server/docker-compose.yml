name: box3-license-control

services:
  license-server:
    build:
      context: ../..
      dockerfile: apps/license-server/Dockerfile
    restart: unless-stopped
    environment:
      BOX_LICENSE_ADMIN_TOKEN: ${BOX_LICENSE_ADMIN_TOKEN:?请设置至少32位管理令牌}
      BOX_LICENSE_PRIVATE_KEY_PATH: /run/secrets/license-private-key.pem
      BOX_LICENSE_TIME_PRIVATE_KEY_PATH: /run/secrets/time-private-key.pem
    volumes:
      - ./.local/license-private-key.pem:/run/secrets/license-private-key.pem:ro
      - ./.local/time-private-key.pem:/run/secrets/time-private-key.pem:ro
    ports:
      - "127.0.0.1:${BOX_LICENSE_PORT:-3220}:3220"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
