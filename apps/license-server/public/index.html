<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BOX3 Engine 许可证管理</title>
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>许可证管理</h1>
        <button id="logout" hidden>退出</button>
      </header>
      <section id="login">
        <h2>管理认证</h2>
        <form id="login-form">
          <input
            name="token"
            type="password"
            autocomplete="current-password"
            placeholder="管理令牌"
            required
          /><button>进入</button>
        </form>
      </section>
      <section id="console" hidden>
        <h2>签发个人学习许可证</h2>
        <form id="issue-form" class="issue-form">
          <label>
            <span>设备 ID</span>
            <input
              name="deviceId"
              type="text"
              autocomplete="off"
              placeholder="dev_..."
              pattern="dev_[a-f0-9]{64}"
              required
            />
          </label>
          <label>
            <span>到期时间</span>
            <input name="expiresAt" type="datetime-local" required />
          </label>
          <button class="primary" type="submit">生成许可证</button>
        </form>
        <p id="message"></p>
        <div id="result" hidden>
          <div class="result-meta">
            <span>许可证 ID：<strong id="license-id"></strong></span>
            <span>到期时间：<strong id="license-expiration"></strong></span>
          </div>
          <textarea id="license-token" readonly aria-label="许可证内容"></textarea>
          <div class="result-actions">
            <button id="copy-license" type="button">复制许可证</button>
            <button id="download-license" type="button">下载 .boxlic 文件</button>
          </div>
        </div>
      </section>
    </main>
    <script src="/admin/app.js" defer></script>
  </body>
</html>
