[package]
name = "box-local-engine-server-manager"
version = "0.3.0"
edition = "2021"
license = "UNLICENSED"

[dependencies]
box-manager-core = { path = "../manager-core" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt", "net"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
urlencoding = "2"
postgres = "0.19.14"
redis = "1.7.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
