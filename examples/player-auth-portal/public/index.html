<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>玩家登录</title>
    <script src="/theme.js?v=20260817"></script>
    <link rel="stylesheet" href="/styles.css?v=20260817" />
  </head>
  <body>
    <header class="portal-header">
      <div class="portal-brand">
        <span class="brand-mark" aria-hidden="true">BOX</span>
        <span><strong>玩家登录</strong><small>PLAYER SERVICE</small></span>
      </div>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="切换界面主题">
        <svg class="theme-icon theme-icon-system" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="13" rx="2"></rect>
          <path d="M8 21h8M12 17v4"></path>
        </svg>
        <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"
          ></path>
        </svg>
        <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path>
        </svg>
      </button>
    </header>
    <main class="page-shell">
      <section class="auth-card" aria-labelledby="page-title">
        <header class="auth-header">
          <span class="eyebrow">PLAYER ACCOUNT</span>
          <h1 id="page-title">登录玩家账号</h1>
          <p id="page-subtitle">登录后继续访问游戏或创作端</p>
        </header>

        <div id="loading-view" class="state-view" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <span>正在检查登录状态</span>
        </div>

        <div id="auth-view" hidden>
          <div class="tabs" role="tablist" aria-label="账号操作">
            <button
              id="login-tab"
              class="tab is-active"
              type="button"
              role="tab"
              aria-selected="true"
            >
              登录
            </button>
            <button id="register-tab" class="tab" type="button" role="tab" aria-selected="false">
              注册
            </button>
          </div>

          <div id="message" class="message" role="alert" hidden></div>

          <form id="login-form" novalidate>
            <label class="field">
              <span>用户名</span>
              <input name="username" autocomplete="username" maxlength="32" required />
            </label>
            <label class="field">
              <span>密码</span>
              <input
                name="password"
                type="password"
                autocomplete="current-password"
                minlength="8"
                required
              />
            </label>
            <button class="primary-button" type="submit">登录</button>
          </form>

          <form id="register-form" novalidate hidden>
            <label class="field">
              <span>用户名</span>
              <input name="username" autocomplete="username" maxlength="32" required />
            </label>
            <label class="field">
              <span>昵称</span>
              <input name="displayName" autocomplete="nickname" maxlength="40" required />
            </label>
            <label class="field">
              <span>密码</span>
              <input
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </label>
            <label class="field">
              <span>确认密码</span>
              <input
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </label>
            <button class="primary-button" type="submit">创建账号</button>
          </form>
        </div>

        <div id="account-view" class="account-view" hidden>
          <div id="avatar" class="avatar" aria-hidden="true"></div>
          <strong id="display-name"></strong>
          <span id="username" class="muted"></span>
          <div id="message-account" class="message" role="alert" hidden></div>
          <a id="continue-link" class="primary-button link-button" href="#" hidden>继续访问</a>
          <button id="logout-button" class="secondary-button" type="button">退出登录</button>
        </div>
      </section>
    </main>
    <script src="/app.js?v=20260817" defer></script>
  </body>
</html>
