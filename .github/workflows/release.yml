name: Release desktop installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
  OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
  OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
  OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  OSS_PREFIX: box-local-engine/${{ github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # package.json is the sole source of the pnpm version. Corepack avoids a
      # second, broad version declaration beside the exact packageManager value
      # and keeps this workflow independent of an action runtime's Node policy.
      - run: corepack enable
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  images:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Docker application images are Linux images. Build each CPU variant
          # on its native runner once; desktop OS only affects the launcher.
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check cached image archive in Aliyun OSS
        id: image-cache
        run: |
          if ! command -v ossutil >/dev/null 2>&1; then
            curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          fi
          ossutil config -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -e "https://$OSS_ENDPOINT"
          archive="box-local-engine-images-${{ github.ref_name }}-linux-${{ matrix.architecture }}.tar.gz"
          object="oss://$OSS_BUCKET/$OSS_PREFIX/$archive"
          if ossutil stat "$object" >/tmp/oss-stat.txt 2>&1; then
            echo "cache-hit=true" >> "$GITHUB_OUTPUT"
            echo "Found cached image archive: $archive"
          elif ossutil cp "$object" "$archive" >/tmp/oss-cache-download.txt 2>&1; then
            # Some RAM policies allow GetObject but not HeadObject (used by
            # `stat`). A successful download is still a valid cache hit.
            echo "cache-hit=true" >> "$GITHUB_OUTPUT"
            echo "Found cached image archive by download: $archive"
          else
            echo "cache-hit=false" >> "$GITHUB_OUTPUT"
            echo "No cached image archive found: $archive"
            cat /tmp/oss-stat.txt || true
            cat /tmp/oss-cache-download.txt || true
          fi
      - name: Build offline images
        if: steps.image-cache.outputs.cache-hit != 'true'
        env:
          BOX_IMAGE_TAG: ${{ github.ref_name }}-linux-${{ matrix.architecture }}
          BOX_PLAY_PLATFORM: linux/${{ matrix.architecture }}
        run: |
          # Build one service at a time. This keeps the large game/asset build
          # stages from Creator, Play and Player Service off disk concurrently.
          for service in player-service player-auth-portal creator play voxa; do
            docker compose build "$service"
          done
          docker image save \
            "box-local-engine-player-service:${BOX_IMAGE_TAG}" \
            "box-local-engine-player-auth-portal:${BOX_IMAGE_TAG}" \
            "box-local-engine-creator:${BOX_IMAGE_TAG}" \
            "box-local-engine-play:${BOX_IMAGE_TAG}" \
            "box-local-engine-voxa:${BOX_IMAGE_TAG}" \
            | gzip -1 > "box-local-engine-images-${BOX_IMAGE_TAG}.tar.gz"
          # The release needs the images and the compressed archive, but not
          # intermediate BuildKit layers. Free them before artifact upload so
          # the ARM worker remains below its Docker storage limit.
          docker builder prune --all --force
      - name: Upload images to Aliyun OSS
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          if ! command -v ossutil >/dev/null 2>&1; then
            curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          fi
          ossutil config -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -e "https://$OSS_ENDPOINT"
          ossutil cp "box-local-engine-images-${{ github.ref_name }}-linux-${{ matrix.architecture }}.tar.gz" \
            "oss://$OSS_BUCKET/$OSS_PREFIX/" --update

  desktop:
    needs: images
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            architecture: amd64
            runner: windows-2022
          - target: macos-arm64
            architecture: arm64
            runner: macos-14
          - target: linux-amd64
            architecture: amd64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Check cached desktop installer in Aliyun OSS
        id: desktop-cache
        shell: bash
        run: |
          if ! command -v ossutil >/dev/null 2>&1; then
            if [[ "${{ matrix.target }}" == windows-* ]]; then
              aws --version
            elif command -v sudo >/dev/null 2>&1; then
              curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
            else
              curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | bash
            fi
          fi
          version="$(node -p "require('./apps/deployment-manager/package.json').version")"
          installer="BOX-Local-Engine-${version}-${{ matrix.target }}.zip"
          object="oss://$OSS_BUCKET/$OSS_PREFIX/$installer"
          if [[ "${{ matrix.target }}" == windows-* ]]; then
            export AWS_ACCESS_KEY_ID="$OSS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$OSS_ACCESS_KEY_SECRET"
            aws configure set default.s3.addressing_style virtual
            aws configure set default.s3.payload_signing_enabled false
            if aws s3api head-object --bucket "$OSS_BUCKET" --key "$OSS_PREFIX/$installer" --endpoint-url "https://$OSS_ENDPOINT" >/tmp/desktop-stat.txt 2>&1; then
              echo "cache-hit=true" >> "$GITHUB_OUTPUT"
              echo "Found cached desktop installer: $installer"
            elif aws s3api get-object --bucket "$OSS_BUCKET" --key "$OSS_PREFIX/$installer" "$RUNNER_TEMP/$installer" --endpoint-url "https://$OSS_ENDPOINT" >/tmp/desktop-cache-download.txt 2>&1; then
              echo "cache-hit=true" >> "$GITHUB_OUTPUT"
              echo "Found cached desktop installer by download: $installer"
            else
              echo "cache-hit=false" >> "$GITHUB_OUTPUT"
              echo "No cached desktop installer found: $installer"
            fi
          elif ossutil stat "$object" >/tmp/desktop-stat.txt 2>&1; then
            echo "cache-hit=true" >> "$GITHUB_OUTPUT"
            echo "Found cached desktop installer: $installer"
          elif ossutil cp "$object" "$RUNNER_TEMP/$installer" >/tmp/desktop-cache-download.txt 2>&1; then
            echo "cache-hit=true" >> "$GITHUB_OUTPUT"
            echo "Found cached desktop installer by download: $installer"
          else
            echo "No cached desktop installer found: $installer"
            cat /tmp/desktop-stat.txt || true
            cat /tmp/desktop-cache-download.txt || true
            echo "cache-hit=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Linux desktop dependencies
        if: startsWith(matrix.target, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf zip
      - name: Download images from Aliyun OSS
        if: steps.desktop-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p apps/local-engine/dist/images
          if ! command -v ossutil >/dev/null 2>&1; then
            if [[ "${{ matrix.target }}" == windows-* ]]; then
              aws --version
            elif command -v sudo >/dev/null 2>&1; then
              curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
            else
              curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | bash
            fi
          fi
          if [[ "${{ matrix.target }}" == windows-* ]]; then
            export AWS_ACCESS_KEY_ID="$OSS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$OSS_ACCESS_KEY_SECRET"
            aws configure set default.s3.addressing_style virtual
            aws configure set default.s3.payload_signing_enabled false
            aws s3api get-object --bucket "$OSS_BUCKET" \
              --key "$OSS_PREFIX/box-local-engine-images-${{ github.ref_name }}-linux-${{ matrix.architecture }}.tar.gz" \
              "apps/local-engine/dist/images/box-local-engine-images-${{ github.ref_name }}-linux-${{ matrix.architecture }}.tar.gz" \
              --endpoint-url "https://$OSS_ENDPOINT"
          else
            ossutil config -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -e "https://$OSS_ENDPOINT"
            ossutil cp "oss://$OSS_BUCKET/$OSS_PREFIX/box-local-engine-images-${{ github.ref_name }}-linux-${{ matrix.architecture }}.tar.gz" \
              apps/local-engine/dist/images/
          fi
      - name: Build installer
        if: steps.desktop-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          archive="apps/local-engine/dist/images/box-local-engine-images-${{ github.ref_name }}-linux-${{ matrix.architecture }}.tar.gz"
          test -f "$archive"
          pnpm build:desktop-installer '${{ matrix.target }}' "$archive"
      - name: Upload desktop installer to Aliyun OSS
        if: steps.desktop-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if ! command -v ossutil >/dev/null 2>&1; then
            if [[ "${{ matrix.target }}" == windows-* ]]; then
              aws --version
            elif command -v sudo >/dev/null 2>&1; then
              curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
            else
              curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | bash
            fi
          fi
          if [[ "${{ matrix.target }}" == windows-* ]]; then
            export AWS_ACCESS_KEY_ID="$OSS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$OSS_ACCESS_KEY_SECRET"
            aws configure set default.s3.addressing_style virtual
            aws configure set default.s3.payload_signing_enabled false
            for installer in apps/local-engine/dist/desktop-installers/*.zip; do
              aws s3api put-object --bucket "$OSS_BUCKET" --key "$OSS_PREFIX/$(basename "$installer")" --body "$installer" --endpoint-url "https://$OSS_ENDPOINT"
            done
          else
            ossutil config -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -e "https://$OSS_ENDPOINT"
            ossutil cp apps/local-engine/dist/desktop-installers/ "oss://$OSS_BUCKET/$OSS_PREFIX/" --recursive --update
          fi

  headless-server:
    needs: images
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Download images from Aliyun OSS
        run: |
          mkdir -p apps/local-engine/dist/images
          if ! command -v ossutil >/dev/null 2>&1; then
            curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          fi
          ossutil config -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -e "https://$OSS_ENDPOINT"
          ossutil cp "oss://$OSS_BUCKET/$OSS_PREFIX/box-local-engine-images-${{ github.ref_name }}-linux-${{ matrix.architecture }}.tar.gz" \
            apps/local-engine/dist/images/
      - name: Build headless Linux server package
        run: |
          source_archive="apps/local-engine/dist/images/box-local-engine-images-${{ github.ref_name }}-linux-${{ matrix.architecture }}.tar.gz"
          server_archive="apps/local-engine/dist/images/box3-engine-play-server-images-${{ github.ref_name }}-linux-${{ matrix.architecture }}.tar.gz"
          test -f "$source_archive"
          docker load -i "$source_archive"
          docker image save \
            "box-local-engine-player-service:${{ github.ref_name }}-linux-${{ matrix.architecture }}" \
            "box-local-engine-player-auth-portal:${{ github.ref_name }}-linux-${{ matrix.architecture }}" \
            "box-local-engine-play:${{ github.ref_name }}-linux-${{ matrix.architecture }}" \
            | gzip -1 > "$server_archive"
          node scripts/build-headless-server-package.js '${{ matrix.architecture }}' "$server_archive"
      - name: Upload server package to Aliyun OSS
        run: |
          if ! command -v ossutil >/dev/null 2>&1; then
            curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          fi
          ossutil config -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -e "https://$OSS_ENDPOINT"
          ossutil cp apps/local-engine/dist/server-packages/ "oss://$OSS_BUCKET/$OSS_PREFIX/" --recursive --update

  publish:
    needs: [desktop, headless-server]
    runs-on: ubuntu-latest
    steps:
      - name: Download release files from Aliyun OSS
        run: |
          if ! command -v ossutil >/dev/null 2>&1; then
            curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          fi
          ossutil config -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -e "https://$OSS_ENDPOINT"
          ossutil cp "oss://$OSS_BUCKET/$OSS_PREFIX/" ./release-files/ --recursive
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-files/*.zip
            release-files/*.tar.gz
