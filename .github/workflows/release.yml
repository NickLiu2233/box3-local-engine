name: Release desktop installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # package.json is the sole source of the pnpm version. Corepack avoids a
      # second, broad version declaration beside the exact packageManager value
      # and keeps this workflow independent of an action runtime's Node policy.
      - run: corepack enable
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  images:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Docker application images are Linux images. Build each CPU variant
          # on its native runner once; desktop OS only affects the launcher.
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build offline images
        env:
          BOX_IMAGE_TAG: ${{ github.ref_name }}-linux-${{ matrix.architecture }}
          BOX_PLAY_PLATFORM: linux/${{ matrix.architecture }}
        run: |
          # Build one service at a time. This keeps the large game/asset build
          # stages from Creator, Play and Player Service off disk concurrently.
          for service in player-service player-auth-portal creator play voxa; do
            docker compose build "$service"
          done
          docker image save \
            "box-local-engine-player-service:${BOX_IMAGE_TAG}" \
            "box-local-engine-player-auth-portal:${BOX_IMAGE_TAG}" \
            "box-local-engine-creator:${BOX_IMAGE_TAG}" \
            "box-local-engine-play:${BOX_IMAGE_TAG}" \
            "box-local-engine-voxa:${BOX_IMAGE_TAG}" \
            | gzip -1 > "box-local-engine-images-${BOX_IMAGE_TAG}.tar.gz"
          # The release needs the images and the compressed archive, but not
          # intermediate BuildKit layers. Free them before artifact upload so
          # the ARM worker remains below its Docker storage limit.
          docker builder prune --all --force
      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.architecture }}
          path: box-local-engine-images-${{ github.ref_name }}-linux-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          # GitHub only accepts whole days for artifact retention. One day is
          # the shortest supported value; release assets are published below.
          retention-days: 1

  desktop:
    needs: images
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            architecture: amd64
            runner: windows-2022
          - target: macos-arm64
            architecture: arm64
            runner: macos-14
          - target: linux-amd64
            architecture: amd64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Install Linux desktop dependencies
        if: startsWith(matrix.target, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf zip
      - uses: actions/download-artifact@v4
        with:
          name: images-${{ matrix.architecture }}
          path: apps/local-engine/dist/images
      - name: Build installer
        shell: bash
        run: |
          archive="apps/local-engine/dist/images/box-local-engine-images-${{ github.ref_name }}-linux-${{ matrix.architecture }}.tar.gz"
          test -f "$archive"
          pnpm build:desktop-installer '${{ matrix.target }}' "$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: apps/local-engine/dist/desktop-installers/*.zip
          if-no-files-found: error
          retention-days: 1

  headless-server:
    needs: images
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: images-${{ matrix.architecture }}
          path: apps/local-engine/dist/images
      - name: Build headless Linux server package
        run: |
          source_archive="apps/local-engine/dist/images/box-local-engine-images-${{ github.ref_name }}-linux-${{ matrix.architecture }}.tar.gz"
          server_archive="apps/local-engine/dist/images/box3-engine-play-server-images-${{ github.ref_name }}-linux-${{ matrix.architecture }}.tar.gz"
          test -f "$source_archive"
          docker load -i "$source_archive"
          docker image save \
            "box-local-engine-player-service:${{ github.ref_name }}-linux-${{ matrix.architecture }}" \
            "box-local-engine-player-auth-portal:${{ github.ref_name }}-linux-${{ matrix.architecture }}" \
            "box-local-engine-play:${{ github.ref_name }}-linux-${{ matrix.architecture }}" \
            | gzip -1 > "$server_archive"
          node scripts/build-headless-server-package.js '${{ matrix.architecture }}' "$server_archive"
      - uses: actions/upload-artifact@v4
        with:
          name: headless-server-${{ matrix.architecture }}
          path: apps/local-engine/dist/server-packages/*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [desktop, headless-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: images-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: headless-server-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.zip
            *.tar.gz
