name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - dev
      - 'dev-*'
      - 'dev/**'
      - 'player-dev/**'
      - 'player-release/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    if: >-
      github.event_name != 'pull_request' ||
      (github.base_ref != 'main' && github.base_ref != 'staging' &&
       !startsWith(github.base_ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: node common/scripts/install-run-rush.js install

      - name: Check formatting, syntax and code style
        run: node common/scripts/install-run-rush.js verify
