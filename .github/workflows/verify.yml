name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - dev
      - staging
      - release
      - 'dev/**'
      - 'release/**'
      - 'player-dev/**'
      - 'player-release/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: node common/scripts/install-run-rush.js install

      - name: Reject unreviewed high and all critical production vulnerabilities
        run: node scripts/audit-dependencies.js

      - name: Validate Compose templates
        env:
          PERMISSION_TOKEN_SECRET: verify-only-secret-0000000000000000
          BOX_PLAYER_AUTH_API_KEY: verify-only-api-key-000000000000000
          BOX_DATABASE_URL: postgresql://verify:verify@127.0.0.1:5432/verify
        run: |
          docker compose --env-file .env.docker.example config --quiet
          docker compose --env-file distribution/play/.env.example -f distribution/play/compose.yml config --quiet

      - name: Verify source and regressions
        run: node common/scripts/install-run-rush.js verify
