name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject critical production vulnerabilities
        run: pnpm audit --prod --audit-level critical

      - name: Validate Compose templates
        env:
          PERMISSION_TOKEN_SECRET: verify-only-secret-0000000000000000
          BOX_PLAYER_AUTH_API_KEY: verify-only-api-key-000000000000000
          BOX_DATABASE_URL: postgresql://verify:verify@127.0.0.1:5432/verify
        run: |
          docker compose --env-file .env.docker.example config --quiet
          docker compose --env-file distribution/play/.env.example -f distribution/play/compose.yml config --quiet

      - name: Verify source and regressions
        run: pnpm verify
