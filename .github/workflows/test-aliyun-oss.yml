name: Test Aliyun OSS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
  OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
  OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
  OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}

jobs:
  test-oss:
    name: Upload and read test object
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check OSS settings
        run: |
          test -n "$OSS_BUCKET" || { echo "Missing secret: ALIYUN_OSS_BUCKET"; exit 1; }
          test -n "$OSS_ENDPOINT" || { echo "Missing secret: ALIYUN_OSS_ENDPOINT"; exit 1; }
          test -n "$OSS_ACCESS_KEY_ID" || { echo "Missing secret: ALIYUN_OSS_ACCESS_KEY_ID"; exit 1; }
          test -n "$OSS_ACCESS_KEY_SECRET" || { echo "Missing secret: ALIYUN_OSS_ACCESS_KEY_SECRET"; exit 1; }

      - name: Install ossutil
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          ossutil config -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -e "https://$OSS_ENDPOINT"

      - name: Upload and read test object
        env:
          TEST_OBJECT: box-local-engine/ci-tests/${{ github.repository }}/${{ github.run_id }}.txt
        run: |
          set -euo pipefail
          printf 'box-local-engine OSS connectivity test\nrun=%s\n' "$GITHUB_RUN_ID" > oss-test.txt
          ossutil cp oss-test.txt "oss://$OSS_BUCKET/$TEST_OBJECT"
          ossutil cp "oss://$OSS_BUCKET/$TEST_OBJECT" oss-test-downloaded.txt
          cmp -s oss-test.txt oss-test-downloaded.txt
          echo "OSS upload and read test passed: $TEST_OBJECT"

      - name: Remove test object
        if: always()
        env:
          TEST_OBJECT: box-local-engine/ci-tests/${{ github.repository }}/${{ github.run_id }}.txt
        run: |
          ossutil rm "oss://$OSS_BUCKET/$TEST_OBJECT" || echo "Warning: cleanup failed; remove this test object manually."
